<!doctype html>
<html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>SHREE BILESHWER COMPUTERS | Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b3b;font-family:system-ui,-apple-system,"Noto Sans Gujarati",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#102a43,#117c80)}.card{background:white;border:1px solid #e0e7ef;border-radius:18px;padding:22px;box-shadow:0 12px 36px #102a4312}.login .card{width:min(420px,100%);padding:30px}.logo{display:grid;place-items:center;width:48px;height:48px;background:linear-gradient(135deg,#0e9f91,#2864dc);color:white;font-weight:900;border-radius:14px}.muted{color:#718096;font-size:13px;line-height:1.6}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:700;font-size:13px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #dce4ed;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:750}.primary{background:linear-gradient(135deg,#0d9f91,#2864dc);color:white}.light{background:white;border:1px solid #dce4ed;color:#172b3b}.danger{background:#fff0f1;color:#b72e3c}.wide{width:100%}.app{display:none}.side{position:fixed;inset:0 auto 0 0;width:250px;background:#102a43;color:white;padding:20px 14px;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:5px 6px 20px;border-bottom:1px solid #ffffff25;font-size:12px;line-height:1.5}.nav{display:grid;gap:5px;margin-top:16px}.nav button{border:0;text-align:left;background:transparent;color:#d4e1ec;padding:11px;border-radius:9px}.nav button.active,.nav button:hover{background:#ffffff1c;color:white}.main{margin-left:250px;min-width:0}.top{position:sticky;top:0;background:white;border-bottom:1px solid #e2e8ef;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}.top h2{font-size:17px;margin:0}.content{padding:24px;max-width:1400px;margin:auto}.hero{background:linear-gradient(115deg,#0d4c63,#117c80,#2864dc);color:white;padding:24px;border-radius:17px}.hero h1{font-size:23px;margin:0 0 8px}.hero p{font-size:13px;margin:0;color:#e1f5f4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0 25px}.stat{background:white;border:1px solid #e1e8ef;padding:15px;border-radius:13px}.stat small{color:#718096}.stat strong{display:block;font-size:24px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.category{display:flex;gap:12px;align-items:center;text-align:left;background:white;color:#172b3b;border:1px solid #e1e8ef;padding:15px;border-radius:13px}.category:hover{border-color:#0e9f91}.category span:first-child{font-size:23px}.category strong{font-size:13px}.category small{display:block;color:#718096;margin-top:4px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 16px}.head h3{margin:0;font-size:17px}.toolbar{display:flex;gap:10px;padding:14px;border-bottom:1px solid #e1e8ef}.toolbar input{flex:1;min-width:100px;padding:10px;border:1px solid #dce4ed;border-radius:9px}.item{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid #e8edf2}.item:last-child{border:0}.info{flex:1;min-width:0}.info strong{font-size:13px}.info p{font-size:12px;color:#718096;overflow-wrap:anywhere}.actions{display:flex;gap:6px}.empty{text-align:center;padding:30px;color:#718096}.form-card{max-width:760px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{background:#fff8e8;border:1px solid #f0dca7;border-radius:10px;padding:12px;font-size:12px;line-height:1.6;margin:15px 0}.toast{display:none;position:fixed;bottom:20px;right:20px;background:#143b46;color:white;padding:12px 16px;border-radius:10px;z-index:10}.mobile{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.side{width:275px;transform:translateX(-100%);transition:.2s;z-index:5}.side.open{transform:translateX(0)}.main{margin:0}.mobile{display:inline-block}.content{padding:14px}.top{padding:13px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.item{align-items:flex-start}.actions{flex-direction:column}.hero h1{font-size:20px}}
</style></head><body>
<section class="login" id="login"><div class="card"><div class="logo">SB</div><h1>SHREE BILESHWER<br>COMPUTERS ADMIN</h1><p class="muted">તમારા ડિજિટલ સેવા કેન્દ્રનું મેનેજમેન્ટ ડેશબોર્ડ</p><form id="loginForm"><div class="field"><label>Email ID</label><input type="email" required placeholder="admin@example.com"></div><div class="field"><label>Password</label><input type="password" required placeholder="તમારો પાસવર્ડ"></div><button class="btn primary wide">ડેમો ડેશબોર્ડ ખોલો →</button></form><p class="muted">નોંધ: આ ડેમો લૉગિન છે, વાસ્તવિક authentication નથી. Supabase આગળના તબક્કામાં જોડાશે.</p></div></section>
<div class="app" id="app"><aside class="side" id="side"><div class="brand"><div class="logo">SB</div><b>SHREE BILESHWER<br>COMPUTERS<br><span style="font-weight:400;color:#a9bfce">Admin workspace</span></b></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn light mobile" id="menu">☰</button><h2 id="pageTitle">ડેશબોર્ડ</h2></div><button class="btn light" id="logout">Logout</button></header><div class="content" id="content"></div></main></div><div class="toast" id="toast"></div>
<script>
const cats=[["education","🎓","અભ્યાસ અને શિક્ષણ"],["jobs","💼","સરકારી નોકરી ભરતી"],["schemes","🏛️","સરકારી યોજનાઓ"],["farmer","🌾","ખેડૂત સહાય"],["online","📝","Online અરજી"],["courses","📚","કોર્સ"],["daily","📅","દૈનિક અપડેટ"],["about","ℹ️","અમારા વિશે"],["ads","📢","જાહેરાત"],["news","📰","NEWS"],["currentJobs","🔔","હાલમાં ચાલુ ભરતી"],["graduateJobs","🎯","ડિગ્રી પાસ ભરતી"],["results","📊","પરીક્ષા રિજલ્ટ"],["formCenter","🖥️","Online ફોર્મ Center"]].map(([id,icon,name])=>({id,icon,name}));
const key="sbc-admin-v1";let data={};let current="dashboard";try{data=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
const $=id=>document.getElementById(id),cat=id=>cats.find(c=>c.id===id),rows=id=>Array.isArray(data[id])?data[id]:[];
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){toast("Browser storage ભરાઈ ગયું છે.")}}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}
function buildNav(){$("nav").innerHTML='<button data-id="dashboard">▦　ડેશબોર્ડ</button>'+cats.map(c=>'<button data-id="'+c.id+'">'+c.icon+'　'+c.name+'</button>').join("");$("nav").querySelectorAll("button").forEach(b=>{b.classList.toggle("active",b.dataset.id===current);b.onclick=()=>go(b.dataset.id)})}
function go(id){current=id;$("side").classList.remove("open");$("pageTitle").textContent=id==="dashboard"?"ડેશબોર્ડ":cat(id).name;buildNav();render()}
function render(){if(current==="dashboard"){$("content").innerHTML='<section class="hero"><h1>નમસ્તે, Administrator 👋</h1><p>તમારા ડિજિટલ સેવા પ્લેટફોર્મની માહિતી એક જ જગ્યાએ મેનેજ કરો.</p></section><div class="stats"><div class="stat"><small>કુલ કેટેગરી</small><strong>'+cats.length+'</strong></div><div class="stat"><small>કુલ એન્ટ્રીઓ</small><strong>'+cats.reduce((n,c)=>n+rows(c.id).length,0)+'</strong></div><div class="stat"><small>સ્ટેટસ</small><strong style="font-size:18px">Demo</strong></div></div><div class="notice">હાલ ડેટા ફક્ત આ બ્રાઉઝરમાં સેવ થાય છે. વેબસાઇટ અને APK વચ્ચે એક જ ડેટા માટે Supabase જોડવાનું રહેશે.</div><div class="head"><h3>બધા વિભાગો</h3></div><div class="grid">'+cats.map(c=>'<button class="category" data-go="'+c.id+'"><span>'+c.icon+'</span><span><strong>'+c.name+'</strong><small>'+rows(c.id).length+' એન્ટ્રી</small></span></button>').join("")+'</div>';$("content").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));return}
const c=cat(current);$("content").innerHTML='<div class="head"><div><h3>'+c.icon+' '+c.name+'</h3><p class="muted">માહિતી ઉમેરો, સુધારો અથવા ડિલીટ કરો.</p></div><button class="btn primary" id="add">＋ નવી માહિતી</button></div><div class="card" style="padding:0"><div class="toolbar"><input id="search" placeholder="માહિતી શોધો..."><span class="muted">'+rows(c.id).length+' એન્ટ્રી</span></div><div id="items">'+(rows(c.id).length?rows(c.id).map((r,i)=>'<div class="item" data-search="'+esc((r.title||"")+" "+(r.description||"")).toLowerCase()+'"><div class="info"><strong>'+esc(r.title||c.name)+'</strong><p>'+esc(r.description||r.link||"")+'</p>'+(r.link?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">લિંક ખોલો ↗</a>':"")+'</div><div class="actions"><button class="btn light" data-edit="'+i+'">Edit</button><button class="btn danger" data-del="'+i+'">Delete</button></div></div>').join(""):'<div class="empty">હજુ કોઈ માહિતી ઉમેરેલી નથી.</div>')+'</div></div>';
$("add").onclick=()=>form(c.id,null);$("search").oninput=e=>{const q=e.target.value.toLowerCase();$("items").querySelectorAll(".item").forEach(n=>n.style.display=n.dataset.search.includes(q)?"flex":"none")};$("items").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>form(c.id,+b.dataset.edit));$("items").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("આ માહિતી ડિલીટ કરવી છે?")){data[c.id].splice(+b.dataset.del,1);save();render();toast("માહિતી ડિલીટ થઈ.")}})}
function form(id,index){const c=cat(id),old=index===null?{}:rows(id)[index];$("content").innerHTML='<div class="head"><h3>'+(index===null?"નવી માહિતી ઉમેરો":"માહિતી સુધારો")+'</h3></div><form class="card form-card" id="entry"><div class="field"><label>શીર્ષક / નામ</label><input id="title" required value="'+esc(old.title||"")+'"></div><div class="field"><label>માહિતી / Description</label><textarea id="description" rows="5">'+esc(old.description||"")+'</textarea></div><div class="field"><label>લિંક (URL)</label><input id="link" type="url" placeholder="https://example.com" value="'+esc(old.link||"")+'"></div><div class="form-actions"><button class="btn light" type="button" id="cancel">રદ કરો</button><button class="btn primary">Save કરો</button></div></form>';$("cancel").onclick=()=>go(id);$("entry").onsubmit=e=>{e.preventDefault();const item={title:$("title").value.trim(),description:$("description").value.trim(),link:$("link").value.trim()};if(!Array.isArray(data[id]))data[id]=[];if(index===null)data[id].unshift(item);else data[id][index]=item;save();go(id);toast("માહિતી સેવ થઈ.")}}
$("loginForm").onsubmit=e=>{e.preventDefault();$("login").style.display="none";$("app").style.display="block";buildNav();render()};$("logout").onclick=()=>{ $("app").style.display="none";$("login").style.display="grid"};$("menu").onclick=()=> $("side").classList.toggle("open");
</script></body></html>
