<!doctype html>
<html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>SHREE BILESHWER COMPUTERS | Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b3b;font-family:system-ui,-apple-system,"Noto Sans Gujarati",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#102a43,#117c80)}.card{background:white;border:1px solid #e0e7ef;border-radius:18px;padding:22px;box-shadow:0 12px 36px #102a4312}.login .card{width:min(420px,100%);padding:30px}.logo{display:grid;place-items:center;width:48px;height:48px;background:linear-gradient(135deg,#0e9f91,#2864dc);color:white;font-weight:900;border-radius:14px}.muted{color:#718096;font-size:13px;line-height:1.6}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:700;font-size:13px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #dce4ed;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:750}.primary{background:linear-gradient(135deg,#0d9f91,#2864dc);color:white}.light{background:white;border:1px solid #dce4ed;color:#172b3b}.danger{background:#fff0f1;color:#b72e3c}.wide{width:100%}.app{display:none}.side{position:fixed;inset:0 auto 0 0;width:250px;background:#102a43;color:white;padding:20px 14px;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:5px 6px 20px;border-bottom:1px solid #ffffff25;font-size:12px;line-height:1.5}.nav{display:grid;gap:5px;margin-top:16px}.nav button{border:0;text-align:left;background:transparent;color:#d4e1ec;padding:11px;border-radius:9px}.nav button.active,.nav button:hover{background:#ffffff1c;color:white}.main{margin-left:250px;min-width:0}.top{position:sticky;top:0;background:white;border-bottom:1px solid #e2e8ef;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}.top h2{font-size:17px;margin:0}.content{padding:24px;max-width:1400px;margin:auto}.hero{background:linear-gradient(115deg,#0d4c63,#117c80,#2864dc);color:white;padding:24px;border-radius:17px}.hero h1{font-size:23px;margin:0 0 8px}.hero p{font-size:13px;margin:0;color:#e1f5f4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0 25px}.stat{background:white;border:1px solid #e1e8ef;padding:15px;border-radius:13px}.stat small{color:#718096}.stat strong{display:block;font-size:24px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.category{display:flex;gap:12px;align-items:center;text-align:left;background:white;color:#172b3b;border:1px solid #e1e8ef;padding:15px;border-radius:13px}.category:hover{border-color:#0e9f91}.category span:first-child{font-size:23px}.category strong{font-size:13px}.category small{display:block;color:#718096;margin-top:4px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 16px}.head h3{margin:0;font-size:17px}.toolbar{display:flex;gap:10px;padding:14px;border-bottom:1px solid #e1e8ef}.toolbar input{flex:1;min-width:100px;padding:10px;border:1px solid #dce4ed;border-radius:9px}.item{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid #e8edf2}.item:last-child{border:0}.info{flex:1;min-width:0}.info strong{font-size:13px}.info p{font-size:12px;color:#718096;overflow-wrap:anywhere}.actions{display:flex;gap:6px}.empty{text-align:center;padding:30px;color:#718096}.thumb{width:76px;height:64px;object-fit:cover;border-radius:9px;border:1px solid #e1e8ef}.preview{max-width:220px;max-height:150px;object-fit:contain;border-radius:10px;display:block;margin-top:8px}.field input[type=checkbox]{width:auto}.form-card{max-width:760px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{background:#fff8e8;border:1px solid #f0dca7;border-radius:10px;padding:12px;font-size:12px;line-height:1.6;margin:15px 0}.toast{display:none;position:fixed;bottom:20px;right:20px;background:#143b46;color:white;padding:12px 16px;border-radius:10px;z-index:10}.mobile{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.side{width:275px;transform:translateX(-100%);transition:.2s;z-index:5}.side.open{transform:translateX(0)}.main{margin:0}.mobile{display:inline-block}.content{padding:14px}.top{padding:13px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.item{align-items:flex-start}.actions{flex-direction:column}.hero h1{font-size:20px}}
</style></head><body>
<section class="login" id="login"><div class="card"><div class="logo">SB</div><h1>SHREE BILESHWER<br>COMPUTERS ADMIN</h1><p class="muted">તમારા ડિજિટલ સેવા કેન્દ્રનું મેનેજમેન્ટ ડેશબોર્ડ</p><form id="loginForm"><div class="field"><label>Email ID</label><input id="email" type="email" autocomplete="username" required placeholder="Admin Email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="તમારો પાસવર્ડ"></div><button class="btn primary wide" id="loginButton">લૉગિન કરો →</button></form><p class="muted">સુરક્ષિત Admin Login · Supabase Authentication</p></div></section>
<div class="app" id="app"><aside class="side" id="side"><div class="brand"><div class="logo">SB</div><b>SHREE BILESHWER<br>COMPUTERS<br><span style="font-weight:400;color:#a9bfce">Admin workspace</span></b></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn light mobile" id="menu">☰</button><h2 id="pageTitle">ડેશબોર્ડ</h2></div><button class="btn light" id="logout">Logout</button></header><div class="content" id="content"></div></main></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://lyalbowhounuwavmbpwt.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5YWxib3dob3VudXdhdm1icHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNjQ2NDgsImV4cCI6MjEwNzc0MDY0OH0._7nxzhSZSAIRgoMMOwd94eYrlZ20IJQaykCo_AZv8AE";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const cats=[["education","🎓","અભ્યાસ અને શિક્ષણ"],["jobs","💼","સરકારી નોકરી ભરતી"],["schemes","🏛️","સરકારી યોજનાઓ"],["farmer","🌾","ખેડૂત સહાય"],["online","📝","Online અરજી"],["courses","📚","કોર્સ"],["daily","📅","દૈનિક અપડેટ"],["about","ℹ️","અમારા વિશે"],["ads","📢","જાહેરાત"],["news","📰","NEWS"],["currentJobs","🔔","હાલમાં ચાલુ ભરતી"],["graduateJobs","🎯","ડિગ્રી પાસ ભરતી"],["results","📊","પરીક્ષા રિજલ્ટ"],["formCenter","🖥️","Online ફોર્મ Center"]].map(([id,icon,name])=>({id,icon,name}));
let data={},current="dashboard",busy=false;
const $=id=>document.getElementById(id),cat=id=>cats.find(c=>c.id===id),rows=id=>Array.isArray(data[id])?data[id]:[];
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",3000)}
function setBusy(on){busy=on;const b=$("loginButton");if(b){b.disabled=on;b.textContent=on?"ચકાસી રહ્યા છીએ…":"લૉગિન કરો →"}}
function buildNav(){$("nav").innerHTML='<button data-id="dashboard">▦　ડેશબોર્ડ</button>'+cats.map(c=>'<button data-id="'+c.id+'">'+c.icon+'　'+c.name+'</button>').join("");$("nav").querySelectorAll("button").forEach(b=>{b.classList.toggle("active",b.dataset.id===current);b.onclick=()=>go(b.dataset.id)})}
async function loadData(){
 const {data:items,error}=await sb.from("content_items").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:false});
 if(error)throw error;
 data={}; for(const c of cats)data[c.id]=[];
 for(const r of (items||[])){if(data[r.category])data[r.category].push({id:r.id,title:r.title||"",description:r.description||"",link:r.link_url||"",image_url:r.image_url||"",item_date:r.item_date||"",item_day:r.item_day||"",is_published:r.is_published})}
}
async function enterApp(){
 $("login").style.display="none";$("app").style.display="block";
 try{await loadData();buildNav();render()}catch(e){$("app").style.display="none";$("login").style.display="grid";await sb.auth.signOut();toast("ડેટા લોડ ન થયું: "+(e.message||"ફરી પ્રયાસ કરો"))}
}
async function checkSession(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return;
 const {data:isAdmin,error}=await sb.rpc("is_current_user_admin");
 if(!error&&isAdmin){await enterApp()}else{await sb.auth.signOut()}
}
function go(id){current=id;$("side").classList.remove("open");$("pageTitle").textContent=id==="dashboard"?"ડેશબોર્ડ":cat(id).name;buildNav();render()}
function render(){
 if(current==="dashboard"){
  $("content").innerHTML='<section class="hero"><h1>નમસ્તે, Administrator 👋</h1><p>તમારા ડિજિટલ સેવા પ્લેટફોર્મની માહિતી એક જ જગ્યાએ મેનેજ કરો.</p></section><div class="stats"><div class="stat"><small>કુલ કેટેગરી</small><strong>'+cats.length+'</strong></div><div class="stat"><small>કુલ એન્ટ્રીઓ</small><strong>'+cats.reduce((n,c)=>n+rows(c.id).length,0)+'</strong></div><div class="stat"><small>સ્ટેટસ</small><strong style="font-size:18px">Connected</strong></div></div><div class="notice">તમામ વિભાગોની માહિતી Supabase માં સેવ કરો. ફોટા પણ Supabase Storage માં અપલોડ થશે. જાહેરમાં બતાવવા માટે “પ્રકાશિત કરો” પસંદ કરો.</div><div class="head"><h3>બધા વિભાગો</h3></div><div class="grid">'+cats.map(c=>'<button class="category" data-go="'+c.id+'"><span>'+c.icon+'</span><span><strong>'+c.name+'</strong><small>'+rows(c.id).length+' એન્ટ્રી</small></span></button>').join("")+'</div>';
  $("content").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));return;
 }
 const c=cat(current);
 $("content").innerHTML='<div class="head"><div><h3>'+c.icon+' '+c.name+'</h3><p class="muted">માહિતી ઉમેરો, સુધારો અથવા ડિલીટ કરો.</p></div><button class="btn primary" id="add">＋ નવી માહિતી</button></div><div class="card" style="padding:0"><div class="toolbar"><input id="search" placeholder="માહિતી શોધો..."><span class="muted">'+rows(c.id).length+' એન્ટ્રી</span></div><div id="items">'+(rows(c.id).length?rows(c.id).map((r,i)=>'<div class="item" data-search="'+esc((r.title||"")+" "+(r.description||"")+" "+(r.item_day||"")).toLowerCase()+'">'+(r.image_url?'<img class="thumb" src="'+esc(r.image_url)+'" alt="ફોટો">':"")+'<div class="info"><strong>'+esc(r.title||c.name)+'</strong>'+(r.item_date?'<p>તારીખ: '+esc(r.item_date)+(r.item_day?' · '+esc(r.item_day):"")+'</p>':"")+'<p>'+esc(r.description||"")+'</p>'+(r.link?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">લિંક ખોલો ↗</a>':"")+'<p>'+((r.is_published===true)?"પ્રકાશિત":"ડ્રાફ્ટ")+'</p></div><div class="actions"><button class="btn light" data-edit="'+i+'">Edit</button><button class="btn danger" data-del="'+i+'">Delete</button></div></div>').join(""):'<div class="empty">હજુ કોઈ માહિતી ઉમેરેલી નથી.</div>')+'</div></div>';
 $("add").onclick=()=>form(c.id,null);
 $("search").oninput=e=>{const q=e.target.value.toLowerCase();$("items").querySelectorAll(".item").forEach(n=>n.style.display=n.dataset.search.includes(q)?"flex":"none")};
 $("items").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>form(c.id,+b.dataset.edit));
 $("items").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("આ માહિતી ડિલીટ કરવી છે?"))return;const row=rows(c.id)[+b.dataset.del];const {error}=await sb.from("content_items").delete().eq("id",row.id);if(error){toast("ડિલીટ ન થયું: "+error.message);return}await loadData();render();toast("માહિતી ડિલીટ થઈ.")});
}
function form(id,index){
 const c=cat(id),old=index===null?{}:rows(id)[index];
 const photoCats=["education","jobs","schemes","farmer","online","courses","ads","news"];
 const needsPhoto=photoCats.includes(id),daily=id==="daily",about=id==="about",shortLink=["results","formCenter"].includes(id);
 const titleLabel=id==="results"?"ધોરણ":id==="formCenter"?"ફોર્મ નામ":["currentJobs","graduateJobs"].includes(id)?"ભરતીનું નામ":"શીર્ષક / નામ";
 const showTitle=!(daily||about),showDescription=!shortLink,showLink=!["daily","about","ads","news"].includes(id);
 const defaultTitle=daily?"દૈનિક અપડેટ":about?"અમારા વિશે":id==="ads"?"જાહેરાત":id==="news"?"NEWS":old.title||"";
 $("content").innerHTML='<div class="head"><h3>'+(index===null?"નવી માહિતી ઉમેરો":"માહિતી સુધારો")+'</h3></div><form class="card form-card" id="entry">'+(showTitle?'<div class="field"><label>'+titleLabel+'</label><input id="title" '+(["ads","news"].includes(id)?"":"required")+' maxlength="250" value="'+esc(old.title||defaultTitle)+'"></div>':"")+(daily?'<div class="field"><label>તારીખ</label><input id="itemDate" type="date" required value="'+esc(old.item_date||new Date().toISOString().slice(0,10))+'"></div><div class="field"><label>વાર</label><input id="itemDay" required maxlength="20" placeholder="સોમવાર" value="'+esc(old.item_day||"")+'"></div>':"")+(needsPhoto?'<div class="field"><label>ફોટો અપલોડ (JPG, PNG, WEBP, GIF · મહત્તમ 5 MB)</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><img id="imagePreview" class="preview" src="'+esc(old.image_url||"")+'" alt="ફોટો પૂર્વદર્શન" style="'+(old.image_url?"":"display:none")+'"><p class="muted">નવો ફોટો પસંદ ન કરો તો જૂનો ફોટો જ રહેશે.</p></div>':"")+(showDescription?'<div class="field"><label>'+(daily||about||id==="ads"||id==="news"?"માહિતી / Description":"માહિતી / Description")+'</label><textarea id="description" rows="5" '+(daily||about||id==="ads"||id==="news"?"required":"")+'>'+esc(old.description||"")+'</textarea></div>':"")+(showLink?'<div class="field"><label>લિંક (URL)</label><input id="link" type="url" placeholder="https://example.com" value="'+esc(old.link||"")+'"></div>':"")+'<div class="field"><label><input id="published" type="checkbox" '+(index===null||old.is_published?"checked":"")+' > જાહેરમાં પ્રકાશિત કરો</label></div><div class="form-actions"><button class="btn light" type="button" id="cancel">રદ કરો</button><button class="btn primary" id="saveEntry">Save કરો</button></div></form>';
 $("cancel").onclick=()=>go(id);
 const fileInput=$("imageFile"),preview=$("imagePreview");
 if(fileInput)fileInput.onchange=()=>{const file=fileInput.files[0];if(!file){preview.style.display=old.image_url?"block":"none";preview.src=old.image_url||"";return}if(file.size>5*1024*1024){fileInput.value="";toast("ફોટો 5 MB કરતાં નાનો હોવો જોઈએ.");return}preview.src=URL.createObjectURL(file);preview.style.display="block"};
 $("entry").onsubmit=async e=>{
  e.preventDefault();const b=$("saveEntry");b.disabled=true;b.textContent="સેવ થાય છે…";
  try{
   let imageUrl=old.image_url||"";
   const file=fileInput&&fileInput.files[0];
   if(file){
    if(file.size>5*1024*1024)throw new Error("ફોટો 5 MB કરતાં નાનો હોવો જોઈએ.");
    if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type))throw new Error("JPG, PNG, WEBP અથવા GIF ફોટો પસંદ કરો.");
    const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
    const path=id+"/"+crypto.randomUUID()+"."+ext;
    const {error:uploadError}=await sb.storage.from("content-images").upload(path,file,{contentType:file.type,upsert:false});
    if(uploadError)throw uploadError;
    imageUrl=sb.storage.from("content-images").getPublicUrl(path).data.publicUrl;
   }
   const titleEl=$("title"),descEl=$("description"),linkEl=$("link");
   const item={category:id,title:titleEl?titleEl.value.trim():defaultTitle,description:descEl?descEl.value.trim():"",link_url:linkEl?linkEl.value.trim():"",image_url:imageUrl,item_date:daily?$("itemDate").value:null,item_day:daily?$("itemDay").value.trim():"",is_published:$("published").checked,updated_at:new Date().toISOString()};
   if(!item.title)item.title=defaultTitle||c.name;
   const result=index===null?await sb.from("content_items").insert(item):await sb.from("content_items").update(item).eq("id",old.id);
   if(result.error)throw result.error;
   await loadData();go(id);toast("માહિતી અને ફોટો Supabase માં સેવ થયા.");
  }catch(err){toast("સેવ ન થયું: "+(err.message||"ફરી પ્રયાસ કરો"));b.disabled=false;b.textContent="Save કરો"}
 };
}
$("loginForm").onsubmit=async e=>{
 e.preventDefault();if(busy)return;setBusy(true);
 const email=$("email").value.trim(),password=$("password").value;
 try{
  const {data:authData,error}=await sb.auth.signInWithPassword({email,password});
  if(error)throw error;
  const {data:isAdmin,error:adminError}=await sb.rpc("is_current_user_admin");
  if(adminError)throw adminError;
  if(!isAdmin){await sb.auth.signOut();throw new Error("આ ઈમેલને Admin પરવાનગી નથી. પહેલાં Supabase માં Admin તરીકે ઉમેરો.")}
  await enterApp();
 }catch(err){toast(err.message||"લૉગિન નિષ્ફળ ગયું.");$("login").style.display="grid";$("app").style.display="none"}
 finally{setBusy(false)}
};
$("logout").onclick=async()=>{await sb.auth.signOut();$("app").style.display="none";$("login").style.display="grid";$("password").value=""};
$("menu").onclick=()=> $("side").classList.toggle("open");
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){$("app").style.display="none";$("login").style.display="grid"}});
checkSession();
</script>
</body></html>
